# One line per pattern; used for cross-feature deduplication at Phase 9
# pattern extraction (check here before proposing a new pattern).

contract-value-citation-lock: Encode ratified values as typed constants with a citation comment per value, literal value-lock tests (never re-import the constant under test), ordered tripwire tests against live structures, and direct-equality wire comparisons.
fixtures-as-phase5-scaffolding: Author validation corpora and their README coverage map at test-scaffolding time against ratified vocabularies, making the fixture-owning milestone verification-weighted (no-change audit record when the sweep is clean).
red-phase-always-green-scaffolding: Keep future-red witnesses independently selectable while delivered behavior stays green; retain pending obligations and require every due witness to execute before claiming proof.
typed-error-channel-rail: Keep IO and bounded-parser failures on the domain's typed error channel — guard reads, enforce byte ceilings before parsing, map documented resource failures, sweep sibling sites, prove the public envelope, and ensure remediation cannot self-loop.
installed-artifact-portability-lane: Prove a packaged application from one installed artifact on an unlike host with scrubbed inputs, checkout-read/network audit hooks, installed-resource oracles, and an independent PATH shim that captures the actual child argv and environment.
artifact-bound-authorization-record: Bind every mutation-authorizing record to complete typed evidence and real contained readable artifact bytes, with exact hashes and anchors, live-disposition positive fixtures, independent destructive mutations, and write-boundary revalidation when targets are mutable.
transitive-consumer-closure: Derive every affected executable leaf by walking reverse dependency edges from shared sources to an authoritative registry, exact-set lock the result, partition each consumer into one behavior family, and require a fixed compatibility case per family before shared promotion.
lock-last-host-adoption-transaction: Adopt multiple files in a user-owned repository from one immutable preflight plan, publish each compatible row atomically, write the membership lock last as the commit point, and make every interruption prefix converge without acquiring ownership of later host edits.
tiered-resource-resolution: "Resolve replaceable assets by override > generated > packaged precedence via one resolve_resource(asset)->(path, source) helper that reports the resolving tier, with a packaged floor so the path is never empty (caveat: a subsystem with its own bundled default may need a narrower resolver to avoid the floor shadowing it)."
derived-state-cache-on-fact-ledger: Reuse identity-bound canonical results through the existing ledger; validate artifacts, preserve warnings, distinguish replay from closure, and publish through the normal locked writer.
verified-by-completeness-rule: Each AC's Verified-by test asserts every Expected clause (exact value not any-of, a negative case, a fixture per named precondition, composition-pinning for surface-unreachable branches) and executes boundary conditions rather than tracing them — including derived-eligibility clauses, driven by a fixture that makes the upstream derivation fire.
cas-guarded-state-write-seam: Make the runtime the single writer for an operational state file through one CAS-guarded atomic seam; when revision-bearing mutations and revision-neutral appenders coexist, serialize every read-transform-replace on a stable workspace-directory descriptor, keep CAS inside that lock, preserve atomic/no-op/dry-run semantics, exact-set lock the write seams, and wrap filesystem failures into the typed channel.
single-resolver-dual-executor: Add a new execution mode (autonomous/scheduled/detached) as a second executor of the one shared next-step resolver — a stateless leaf loop of resolve→execute-the-single-front-move→re-derive-done-from-artifacts — never a parallel state machine; mode-conditional behavior lives as derivations in the shared resolver, so the modes provably cannot drift.
author-fact-and-artifact-from-one-production-path: When a machine-readable fact and a human-readable audit artifact (journal/report) must agree, write both from the same production payload+loop and audit the artifact against the recorded facts (a real fact-backed oracle, not present+well-formed); make production the authoritative reconciling writer, verify the producer is reachable in a real run, and keep the render/parse lossless.
registry-over-literal-versioning: Declare exactly which format versions have supported readers; refuse other versions without mutation and offer only implemented recovery paths.
fatal-advisory-by-reliance-test: Classify every validator finding fatal vs advisory by one question — does a command or derivation rely on the violated fact? — deriving the per-check buckets as the rule's application (not a curated list), forbidding age/count/blocks-a-transition as severity inputs, and mapping worst-severity to one exit code over an accumulated finding set with free-form per-finding codes under one constrained top-level code.
repo-global-sweep-catch-and-continue: A repo-global command visiting every workspace isolates per-item faults (try/except continue at every raising layer, catching structural exceptions ValueError/OSError/UnicodeDecodeError not just the domain error), reports the per-item success/skip split through diagnostics because failure envelopes are data-xor-error, and sets the top-level code by class precedence (single-item code only when it is the sole fatal class, else the umbrella); never swallow a retryable conflict.
tolerant-evidence-projection: Preserve an external tool's original evidence while extracting a normalized machine projection; accept unambiguous presentation drift with durable fresh/cache warnings for supervisor review, and reject only missing, contradictory, or semantically ambiguous evidence.
self-observation-safe-evidence-publication: When a command runs observers that inspect its worktree, capture outside the tree, allocate one unique final path per concurrent attempt, atomically publish before recording the fact, and keep a CAS loser's orphan non-authoritative.
event-anchored-fake-clock: Key fake-clock jumps in timing tests to observed harness events (an emitted event, a fake-port call counter, a recorded checkpoint) instead of calibrated clock-read counts or tuned uniform steps, so tests survive production changes to clock-read frequency; treat reads<=N literals over a clock fake as fragility findings.
content-bound-verification-authority: Bind verification to its exact command, source definition and stable before/after content; requalify at the consuming boundary and retain accepted evidence before cleanup.
conjunctive-safety-decision-matrix: Prove a multi-condition safety decision with one all-true permitted row, one sole-false blocking row per primitive prerequisite, and only evidence-justified interaction and boundary-revalidation rows.
