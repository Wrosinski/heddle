# Heddle project configuration scaffold.
# Defaults apply to every absent key; an empty file is valid.
# Uncomment only the settings this host intentionally overrides.
#
# layout:
#   specs: docs/features
#   plans: plans
#   prompts: .heddle/prompts
#   schemas: .heddle/schemas
#   tests: tests
#   source: src
#
# commands:
#   test: pytest
#   lint: ruff check .
#   typecheck: mypy
#
# agents:
#   claude: true
#   codex: true
#
# gates:
#   enabled: [spec-review, plan-review]
#
# autopilot:
#   flow: hitl
#   notify_command: notify-send
#   notify_timeout_s: 10
#   max_turns: 100
#   max_budget_usd: 150.0
#   # Host tooling owns autopilot.test_command, this additional close suite. It
#   # does not replace feature proof. Heddle does not create a clean environment;
#   # it runs the command in the current host checkout.
#   test_command: pytest
#
# Owner checkpoints stay on unless a host turns them off. `specification` is
# the owner's green light on the drafted spec and plan before any review;
# `review_changes` confirms what spec and plan review changed. The owner can
# also skip them for one feature at its research checkpoint.
# checkpoints:
#   specification: true
#   review_changes: true
