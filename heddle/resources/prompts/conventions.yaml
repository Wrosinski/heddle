conventions:
  EARS:
    keywords: [EARS, Requirements]
  RFC2119:
    keywords: [MUST, SHOULD, MAY, Priority]
  VerifiedBy:
    keywords: [Verified-by]
  Gherkin:
    keywords: [Scenario Outline, Gherkin]
  DispositionLedger:
    mode: all
    keywords: [settled ground, re-raise]
  ThreatActor:
    mode: all
    keywords:
      - must name its threat actor
      - only the routing of out-of-model gaps changes
  BoundaryProof:
    mode: all
    keywords:
      - every state that crosses a boundary
      - able to fail for the real defect

prompts:
  spec-review.md:
    [RFC2119, Gherkin, DispositionLedger, ThreatActor, BoundaryProof]
  plan-review.md: [DispositionLedger, ThreatActor, BoundaryProof]
  review-test-scaffolding.md:
    [VerifiedBy, Gherkin, DispositionLedger, ThreatActor, BoundaryProof]
  milestone-review.md: [DispositionLedger, BoundaryProof]
  peer-review-sequential.md:
    [RFC2119, DispositionLedger, ThreatActor, BoundaryProof]
  behavior-review.md: [DispositionLedger, BoundaryProof]
  complexity-review.md: [DispositionLedger, BoundaryProof]
  robustness-analysis.md: [DispositionLedger, ThreatActor, BoundaryProof]
