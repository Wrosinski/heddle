name: Quality

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Check local-record publication boundary
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .venv/bin/python scripts/check-public-repository.py history --base "$BASE_REV" --head "$HEAD_REV"
      - name: Run repository hooks
        run: .venv/bin/pre-commit run --all-files
      - name: Run fast tests
        run: .venv/bin/python -m pytest --test-band=fast
      - name: Provision toolchain prerequisites
        # The wheel harness builds with `poetry build`, and the formatter
        # witness installs the locked Prettier fixture offline from ~/.npm.
        run: |
          pipx install poetry==2.1.4
          cp -r tests/fixtures/toolchains/prettier-3.9.6 "$RUNNER_TEMP/prettier-3.9.6"
          cd "$RUNNER_TEMP/prettier-3.9.6" && npm ci --ignore-scripts
      - name: Run toolchain tests
        run: .venv/bin/python -m pytest --test-band=toolchain
